name: OCRtoODT Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

# ------------------------------------------------------------
# Checkout
# ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

# ------------------------------------------------------------
# Determine version from git tag
# ------------------------------------------------------------

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

# ------------------------------------------------------------
# Cache apt packages (massive speed boost)
# ------------------------------------------------------------

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >
            build-essential
            cmake
            ninja-build
            qt6-base-dev
            qt6-tools-dev
            qt6-tools-dev-tools
            qt6-multimedia-dev
            qt6-svg-dev
            libpoppler-qt6-dev
            libopencv-dev
            libtesseract-dev
            libleptonica-dev
            libxkbcommon-dev
            patchelf
            fuse
            wget
            file
          version: 1

# ------------------------------------------------------------
# Cache build directory
# ------------------------------------------------------------

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

# ------------------------------------------------------------
# Configure
# ------------------------------------------------------------

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION=${{ env.VERSION }} \
            -G Ninja

# ------------------------------------------------------------
# Build
# ------------------------------------------------------------

      - name: Build
        run: cmake --build build

# ------------------------------------------------------------
# Install to AppDir
# ------------------------------------------------------------

      - name: Install
        run: |
          cmake --install build --prefix AppDir/usr

# ------------------------------------------------------------
# Download linuxdeploy + plugins
# ------------------------------------------------------------

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

# ------------------------------------------------------------
# Build AppImage
# ------------------------------------------------------------
      - name: Build AppImage
        env:
          QMAKE: /usr/lib/qt6/bin/qmake
          UPDATE_INFORMATION: gh-releases-zsync|${{ github.repository }}|latest|OCRtoODT-*.AppImage.zsync
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/OCRtoODT \
            --desktop-file AppDir/usr/share/applications/OCRtoODT.desktop \
            --icon-file resources/icons/ocrtoodt.png \
            --plugin qt \
            --output appimage
            
# ------------------------------------------------------------
# Install AppImage tools
# ------------------------------------------------------------

      - name: Install AppImage tools
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          wget -q https://github.com/AppImage/AppImageUpdate/releases/download/continuous/appimageupdatetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          chmod +x appimageupdatetool-x86_64.AppImage

# ------------------------------------------------------------
# Generate zsync file
# ------------------------------------------------------------

      - name: Generate zsync
        run: |
          ./appimagetool-x86_64.AppImage --appimage-extract
          ./appimagetool-x86_64.AppImage squashfs-root OCRtoODT-x86_64.AppImage

# ------------------------------------------------------------
# Import GPG key (for AppImage signing)
# ------------------------------------------------------------

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APPIMAGE_GPG_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

# ------------------------------------------------------------
# Sign AppImage
# ------------------------------------------------------------

      - name: Sign AppImage
        run: |
          gpg --detach-sign --armor OCRtoODT-x86_64.AppImage

# ------------------------------------------------------------
# Create GitHub Release
# ------------------------------------------------------------

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: OCRtoODT ${{ env.VERSION }}
          draft: true
          body: |
            # OCRtoODT ${{ env.VERSION }}

            Major architectural update.

            ## New features
            - GoldenDict-style OCR language management
            - OCR language profiles
            - JSON-based language registry
            - Redesigned recognition settings UI

            ## Internal improvements
            - New OcrLanguageManager
            - New OcrProfileStorage
            - Fixed Tesseract datapath resolution
            - Improved OCR pipeline stability

            This release introduces the new language architecture for OCR.

          files: |
            OCRtoODT-x86_64.AppImage
            OCRtoODT-x86_64.AppImage.zsync
            OCRtoODT-x86_64.AppImage.asc
